version: "3.8"

services:
  # 🌐 API principal - PROD
  alcaldiafetch-api-prod:
    container_name: alcaldiafetch-api-prod
    build:
      context: ../..
      dockerfile: Web/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "5103:8080"
    networks:
      - alcaldiafetch_network
    labels:
      - com.alcaldiafetch.environment=prod

volumes:
  sqldata_prod:

networks:
  alcaldiafetch_network:
    external: true