version: "3.8"

services:
  # 🗄️ SQL Server - DEVELOP
  alcaldiafetch-sqlserver-develop:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alcaldiafetch-sqlserver-develop
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin123!"
      MSSQL_PID: "Developer"
    ports:
      - "1438:1433"
    volumes:
      - sqldata_develop:/var/opt/mssql
    networks:
      - alcaldiafetch_network

  # 🗄️ SQL Server - QA
  alcaldiafetch-sqlserver-qa:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alcaldiafetch-sqlserver-qa
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin123!"
      MSSQL_PID: "Developer"
    ports:
      - "1436:1433"
    volumes:
      - sqldata_qa:/var/opt/mssql
    networks:
      - alcaldiafetch_network

  # 🗄️ SQL Server - STAGING
  alcaldiafetch-sqlserver-staging:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alcaldiafetch-sqlserver-staging
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin123!"
      MSSQL_PID: "Developer"
    ports:
      - "1437:1433"
    volumes:
      - sqldata_staging:/var/opt/mssql
    networks:
      - alcaldiafetch_network

  # 🗄️ SQL Server - PROD
  alcaldiafetch-sqlserver-prod:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alcaldiafetch-sqlserver-prod
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Admin123!"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - sqldata_prod:/var/opt/mssql
    networks:
      - alcaldiafetch_network

volumes:
  sqldata_develop:
  sqldata_qa:
  sqldata_staging:
  sqldata_prod:

networks:
  alcaldiafetch_network:
    external: true
